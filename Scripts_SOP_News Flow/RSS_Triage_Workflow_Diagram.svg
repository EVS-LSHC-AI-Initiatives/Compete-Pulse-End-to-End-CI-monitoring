<svg viewBox="0 0 2000 1170" xmlns="http://www.w3.org/2000/svg" role="img">
<title>RSS Triage Workflow — Execution Pipeline</title>
<desc>Polished diagram of the MASH CI RSS Triage Workflow: Feed Health Check, Parallel RSS Extraction across five pipelines, Link Dedup, Parallel AI Triage via the Parallel Task Group API, and Orchestration/Output, ending in a time-saved summary showing 3 hours of manual news scanning reduced to 15 minutes of review.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/>
  </marker>
</defs>
<style>
  :root{
    --p50:#EEEDFE; --p200:#AFA9EC; --p600:#534AB7; --p900:#26215C;
    --k50:#FBEAF0; --k200:#ED93B1; --k600:#993556; --k900:#4B1528;
