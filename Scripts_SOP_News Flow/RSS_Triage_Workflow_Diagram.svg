<rect x="1208" y="212" width="356" height="474" rx="12" fill="var(--white)" stroke="var(--line)" stroke-width="1.5"/>
<line x1="1226" y1="236" x2="1546" y2="236" stroke="var(--line)"/>

<circle cx="1230" cy="254" r="3" fill="var(--c600)"/>
