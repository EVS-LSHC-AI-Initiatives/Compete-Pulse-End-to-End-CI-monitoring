    --n50:#F7F6F2; --n100:#E7E4DA; --n200:#B4B2A9; --n600:#5F5E5A; --n900:#2C2C2A;
    --ink:#26215C; --sub:#5F5E5A; --line:#E7E4DA; --white:#ffffff;
  }
  text{ font-family: 'Segoe UI', Arial, sans-serif; fill: var(--ink); }
  .h-title{ font-size:31px; font-weight:800; fill:var(--p900); letter-spacing:-0.3px; }
  .h-sub{ font-size:14.5px; fill:var(--sub); }
  .brand{ font-size:11.5px; font-weight:700; fill:var(--p900); letter-spacing:0.6px; }
  .eyebrow{ font-size:11.5px; font-weight:800; letter-spacing:1.2px; }
  .col-title{ font-size:19px; font-weight:800; fill:var(--p900); }
  .col-sub{ font-size:11.5px; fill:var(--sub); }
  .bl1{ font-size:12.5px; font-weight:600; fill:var(--p900); }
  .bl2{ font-size:11.5px; fill:var(--sub); }
  .out-label{ font-size:10px; font-weight:800; letter-spacing:1px; }
  .out-text{ font-size:11.8px; fill:var(--p900); font-weight:600; }
  .cap-text{ font-size:11px; fill:var(--sub); }
  .sub-bold{ font-size:12px; font-weight:700; fill:var(--p900); }
  .sub-gray{ font-size:10.6px; fill:var(--sub); }
  .badge-text{ font-size:10px; font-weight:800; letter-spacing:0.3px; }
  .footer-text{ font-size:11.8px; fill:var(--sub); }
  .brand-sub{ font-size:9.5px; fill:var(--sub); }
  .hero-eyebrow{ font-size:12.5px; font-weight:800; letter-spacing:1.6px; fill:var(--k600); }
  .hero-title{ font-size:21px; font-weight:800; fill:var(--p900); }
  .hero-num{ font-size:42px; font-weight:800; }
  .hero-cap{ font-size:11.5px; fill:var(--sub); }
  .pill-text{ font-size:14px; font-weight:800; }
</style>

