<text x="1240" y="320" class="bl2">Milestone Type, Rationale, Source-Check</text>

<circle cx="1230" cy="346" r="3" fill="var(--c600)"/>
<text x="1240" y="350" class="bl1">Checkpointed per row — reruns</text>
<text x="1240" y="366" class="bl2">only re-fetch rows that never finished</text>

<circle cx="1230" cy="392" r="3" fill="var(--c600)"/>
<text x="1240" y="396" class="bl1">Auto-retries ERROR / NOT</text>
<text x="1240" y="412" class="bl2">PROCESSED rows up to 3 times</text>

<rect x="1226" y="428" width="320" height="52" rx="8" fill="var(--c50)"/>
